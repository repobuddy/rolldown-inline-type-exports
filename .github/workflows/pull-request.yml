name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

jobs:
  code:
    uses: repobuddy/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # The changesets "version packages" PR is the last point where the exact contents of
  # the next release are both knowable and reviewable. Skipped on every other PR, so it
  # must never be a required status check.
  publish-gate:
    if: startsWith(github.head_ref, 'changeset-release/')
    uses: repobuddy/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read
